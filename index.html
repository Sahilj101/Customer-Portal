age.","The stage changes when the work changes.","Files hang on the job they belong to.","Every job, every department, one screen."]},M0=[{stamp:"awaiting your feedback",title:"We need you",body:"A CAD, render or quote is sitting with you. Nothing moves until you look."},{stamp:"delivered",title:"Files are ready",body:"The output is on the job, attached and downloadable."}],A0=[{q:"What do I need to get in?",a:"An invite to your own space from us, and a password. No software to buy and nothing to install. Open it in a browser on your laptop, or use the mobile app if you would rather have it in your pocket."},{q:"Am I going to be buried in notifications?",a:"No. We deliberately hold notifications back to two moments: when a job is awaiting your feedback, and when files are delivered. Every other stage change happens quietly in the background for you to read when you want it."},{q:"Can my team see it too?",a:"Yes. Tell us who should have access and we will add them. Most retailers add whoever handles client communication alongside the owner."},{q:"Can other jewellers see my jobs?",a:"Never. Each customer has a separate, private space. You see your jobs and nothing else, and no other customer can see yours."},{q:"Where do I approve a CAD or ask for a change?",a:"On the job itself. Open it, leave a comment, and the team working on it is notified straight away. Your feedback lives next to the model it belongs to instead of in an email chain."},{q:"Can I have a conversation about one specific job or quote?",a:"Yes, and this is the part worth changing your habits for. Every job has its own comment thread, so a question about one quote stays on that quote. Assign a comment to someone on our side and it becomes their open item until they answer it. No more threads covering four orders where the answer you need is buried in the middle."},{q:"Can I find tracking details once a job has shipped?",a:"Yes. Ship date and tracking ID sit on the job in the Manufacturing list, so you
